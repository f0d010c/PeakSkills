name: Build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify
        shell: pwsh
        run: .\scripts\verify-peakskills.ps1
